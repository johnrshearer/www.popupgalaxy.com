title: "Pop-Up Galaxy"
url: "https://popupgalaxy.com"
theme: "minimal-mistakes-jekyll"

# Language Configuration
locale: "en"
languages: ["en", "es"]

plugins:
  - jekyll-feed
#  - jekyll-include-cache

# Default layout settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      author_profile: false
      sidebar:
        nav: "sidebar_en"

include:
  - _pages
